models:
  - name: sak_uforetrygd
    description: |
        Styringsinformasjon for uføretrygdsaker i Pesys.
        Gir én rad per sak med grunnleggende saksinformasjon, samt kjønn og fødselsår for personen på saken.
        Tar utgangspunkt i saker med løpende vedtak (se int_sak_ufore), og inneholder derfor kun saker som har eller har hatt et løpende vedtak.
    columns:
      - name: sak_id
        description: Sak-id i Pesys. Unik i tabellen. Fra feltet t_sak.sak_id.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: k_sak_t
        description: Type sak i Pesys, her alltid "UFOREP". Fra feltet t_sak.k_sak_t.
        data_type: varchar2
      - name: kjonn
        description: Kjønn utledet fra fødselsnummeret til personen på saken.
        data_type: varchar2
      - name: fodselsaar
        description: Fødselsår til personen på saken. Fra feltet t_person.dato_fodsel.
        data_type: number
      - name: k_utlandstilknytning
        description: Angir om saken har en utenlandstilknytning. Fra feltet t_sak.k_utlandstilknytning.
        data_type: varchar2
      - name: sak_dato_opprettet
        description: Tidspunkt for når saken ble opprettet i Pesys. Fra feltet t_sak.dato_opprettet.
        data_type: date
      - name: avsluttet_dato
        description: Dato for når saken ble avsluttet. Alltid null i dagens versjon av modellen.
        data_type: date
      - name: avsluttet_arsak
        description: Årsak til at saken ble avsluttet. Alltid null i dagens versjon av modellen.
        data_type: varchar2(255)
      - name: gyldig_fra_dato
        description: Dato for virkningstidspunkt for det første vedtaket på saken. Fra feltet t_vedtak.dato_virk_fom (minste verdi).
        data_type: date
      - name: gyldig_til_dato
        description: Dato for når det siste løpende vedtaket på saken opphører. Fra feltet t_vedtak.dato_lopende_tom (største verdi).
        data_type: date
      - name: har_ikke_sammenhengende_vedtak
        description: Flagg (0/1) som angir om saken har hatt opphold på mer enn én dag mellom to påfølgende vedtaksperioder.
        data_type: number
      - name: kjoretidspunkt
        description: Tidspunkt for når modellen sist ble kjørt (UTC).
        data_type: timestamp

  - name: sakshistorikk_uforetrygd
    description: |
        Historikk over sammenhengende perioder med løpende uførevedtak per sak.
        Gir én rad per periode per sak, der periodene skilles av opphold på mer enn én dag mellom vedtak.
    columns:
      - name: sak_id
        description: Sak-id i Pesys.
        data_type: number
      - name: totalt_antall_perioder
        description: Totalt antall sammenhengende perioder med løpende vedtak på saken.
        data_type: number
      - name: periode_nr
        description: Nummer på perioden, sortert kronologisk fra 1.
        data_type: number
      - name: er_siste_periode
        description: Flagg (0/1) som angir om perioden er den siste perioden på saken.
        data_type: number
      - name: forste_dato_lopende_fom
        description: Første dato fra og med for løpende vedtak i perioden.
        data_type: date
      - name: siste_dato_lopende_tom
        description: Siste dato til og med for løpende vedtak i perioden. Null dersom perioden inneholder et vedtak uten sluttdato.
        data_type: date
      - name: forste_dato_virk_fom
        description: Første virkningsdato fra og med for vedtak i perioden.
        data_type: date
      - name: kjoretidspunkt
        description: Tidspunkt for når modellen sist ble kjørt (UTC).
        data_type: timestamp
